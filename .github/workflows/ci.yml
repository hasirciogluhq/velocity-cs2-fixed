name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**']
  workflow_dispatch:
  workflow_call:   # release.yml runs this same build before publishing

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: windows-msvc (${{ matrix.mode }})
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        mode: [debug, release]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          mode: ${{ matrix.mode }}

      - id: build
        uses: ./.github/actions/build
        with:
          mode: ${{ matrix.mode }}
          name: velocity-${{ matrix.mode }}-${{ github.ref_type == 'tag' && github.ref_name || github.sha }}

      - uses: actions/upload-artifact@v7
        with:
          name: velocity-${{ matrix.mode }}
          path: ${{ steps.build.outputs.archive }}
