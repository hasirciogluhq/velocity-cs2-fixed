name: Release

# On a v* tag:  ci + docs build (parallel) -> docs deploy (stable tags only) -> GitHub release from CI's artifacts.
# A tag with a hyphen (v1.0.0-rc.1) skips the docs and becomes a pre-release.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  docs-build:
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: docs/package.json

      - run: bun install --frozen-lockfile

      - run: bun run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  docs-deploy:
    needs: [ci, docs-build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  release:
    needs: [ci, docs-build, docs-deploy]
    # Pre-releases skip the docs jobs; everything that did run must have passed.
    if: >-
      ${{ !cancelled() && needs.ci.result == 'success' &&
          (contains(github.ref_name, '-') || (needs.docs-build.result == 'success' && needs.docs-deploy.result == 'success')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Ensure tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Tag $GITHUB_REF_NAME is not on main"; exit 1; }

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l artifacts
          flags=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" artifacts/*.zip --verify-tag --generate-notes --title "$GITHUB_REF_NAME" "${flags[@]}"
