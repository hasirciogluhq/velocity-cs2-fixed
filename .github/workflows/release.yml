name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag is on main
        shell: pwsh
        run: |
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "Tag ${{ github.ref_name }} is not on main" }

      - uses: ./.github/actions/setup
        with:
          mode: release

      - id: build
        uses: ./.github/actions/build
        with:
          mode: release
          name: velocity-${{ github.ref_name }}

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "${{ steps.build.outputs.archive }}" --verify-tag --generate-notes --title "${{ github.ref_name }}"
