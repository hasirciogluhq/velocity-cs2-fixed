name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-2025-vs2026
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Ensure tag is on main
        shell: pwsh
        run: |
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "Tag ${{ github.ref_name }} is not on main" }

      - uses: ./.github/actions/setup
        with:
          mode: release

      - id: build
        uses: ./.github/actions/build
        with:
          mode: release
          name: velocity-${{ github.ref_name }}

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $flags = @()
          if ($tag -like "*-*") { $flags += "--prerelease" }  # v1.0.0-rc.1 -> pre-release
          gh release create $tag "${{ steps.build.outputs.archive }}" --verify-tag --generate-notes --title $tag @flags

  # Runs beside the release job on its own runner, for stable tags only (v1.2.0, not v1.2.0-rc.1).
  docs:
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: docs/package.json

      - run: bun install --frozen-lockfile

      - run: bun run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

      - id: deploy
        uses: actions/deploy-pages@v5
